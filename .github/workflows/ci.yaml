name: ci
on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Format, analyze and test
    if: |
      github.repository_owner == 'eaceto' &&
      github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
    - run: flutter pub get
    # Fails when a file is not formatted. pub.dev deducts points for it.
    - run: dart format --set-exit-if-changed -o none lib test example/lib
    - run: flutter analyze --fatal-infos lib test
    - run: flutter test
    # Fails on any issue that would prevent publishing to pub.dev
    - run: flutter pub publish --dry-run

  android:
    name: Android build and unit tests
    if: |
      github.repository_owner == 'eaceto' &&
      github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
    # Builds the example app, which also generates the Gradle wrapper used below
    - run: flutter build apk --debug
      working-directory: example
    # Runs the Kotlin unit tests of the plugin
    - run: ./gradlew :flutter_local_authentication:testDebugUnitTest
      working-directory: example/android

  linux:
    name: Linux build
    if: |
      github.repository_owner == 'eaceto' &&
      github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Install Linux desktop dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
    - run: flutter build linux --debug
      working-directory: example

  darwin:
    name: iOS and macOS build
    if: |
      github.repository_owner == 'eaceto' &&
      github.event.pull_request.draft != true
    runs-on: macos-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
    - run: flutter build ios --debug --no-codesign
      working-directory: example
    - run: flutter build macos --debug
      working-directory: example
